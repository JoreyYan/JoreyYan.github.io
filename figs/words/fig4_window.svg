<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="Georgia, 'Noto Serif SC', serif">
  <rect width="660" height="300" fill="#f3f0e7"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1c211b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#1c211b">图 4 · 离散状态显现在中间尺度</text>
  <line x1="70" y1="150" x2="600" y2="150" stroke="#1c211b" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="610" y="154" font-size="11.5" fill="#1c211b" font-style="italic">观察尺度</text>

  <line x1="222" y1="142" x2="222" y2="158" stroke="#1c211b" stroke-width="1.2"/>
  <line x1="430" y1="142" x2="430" y2="158" stroke="#1c211b" stroke-width="1.2"/>
  <text x="222" y="177" text-anchor="middle" font-size="11.5" fill="#1c211b" font-style="italic">τ intra</text>
  <text x="430" y="177" text-anchor="middle" font-size="11.5" fill="#1c211b" font-style="italic">τ inter</text>
  <line x1="222" y1="150" x2="430" y2="150" stroke="#1c211b" stroke-width="3.2"/>

  <text x="146" y="109" text-anchor="middle" font-size="12" fill="#1c211b">微观</text>
  <text x="146" y="129" text-anchor="middle" font-size="10.5" fill="#777d75">看见连续轨迹</text>
  <text x="326" y="104" text-anchor="middle" font-size="13" fill="#1c211b">状态</text>
  <text x="326" y="125" text-anchor="middle" font-size="10.5" fill="#777d75">看见稳定盆地与稀疏跃迁</text>
  <text x="516" y="109" text-anchor="middle" font-size="12" fill="#1c211b">统计</text>
  <text x="516" y="129" text-anchor="middle" font-size="10.5" fill="#777d75">单次跃迁被平均</text>

  <path d="M222 201 L222 211 L430 211 L430 201" fill="none" stroke="#1c211b" stroke-width="1"/>
  <text x="326" y="234" text-anchor="middle" font-size="12" fill="#1c211b">对象 · 概念 · 事件 · 稳定构象</text>
  <text x="326" y="255" text-anchor="middle" font-size="11" fill="#777d75" font-style="italic">在这里形成有效的粗粒化描述</text>
  <text x="330" y="285" text-anchor="middle" font-size="11.5" fill="#1c211b">足够稳定值得命名，又足够会变值得预测</text>
</svg>
