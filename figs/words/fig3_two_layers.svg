<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="Georgia, 'Noto Serif SC', serif">
  <rect width="660" height="340" fill="#f3f0e7"/>
  <defs>
    <marker id="darkArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1c211b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="lightArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#777d75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#1c211b">图 3 · 两层之间的投影与实现</text>
  <line x1="70" y1="96" x2="600" y2="96" stroke="#b7bbb4" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="70" y="80" font-size="11" fill="#777d75" font-style="italic">宏观层 · 慢变量 · 可复用状态</text>

  <rect x="120" y="100" width="96" height="34" fill="none" stroke="#1c211b" stroke-width="1.2"/>
  <text x="168" y="122" text-anchor="middle" font-size="12" fill="#1c211b">杯子在桌上</text>
  <rect x="290" y="100" width="96" height="34" fill="none" stroke="#1c211b" stroke-width="1.2"/>
  <text x="338" y="122" text-anchor="middle" font-size="12" fill="#1c211b">杯子在手里</text>
  <rect x="460" y="100" width="96" height="34" fill="none" stroke="#1c211b" stroke-width="1.2"/>
  <text x="508" y="122" text-anchor="middle" font-size="12" fill="#1c211b">杯子碎了</text>
  <line x1="216" y1="117" x2="286" y2="117" stroke="#1c211b" stroke-width="1.1" marker-end="url(#darkArrow)"/>
  <line x1="386" y1="117" x2="456" y2="117" stroke="#1c211b" stroke-width="1.1" marker-end="url(#darkArrow)"/>

  <line x1="70" y1="252" x2="600" y2="252" stroke="#b7bbb4" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="70" y="286" font-size="11" fill="#777d75" font-style="italic">微观层 · 快变量 · 连续状态</text>
  <ellipse cx="168" cy="222" rx="52" ry="26" fill="none" stroke="#777d75" stroke-width="1"/>
  <ellipse cx="338" cy="222" rx="52" ry="26" fill="none" stroke="#777d75" stroke-width="1"/>
  <ellipse cx="508" cy="222" rx="52" ry="26" fill="none" stroke="#777d75" stroke-width="1"/>
  <path d="M140 222 q7 -8 14 0 q7 8 14 0 q7 -8 14 0 q7 8 14 0" fill="none" stroke="#1c211b" stroke-width="0.9" opacity="0.6"/>
  <path d="M310 222 q7 -8 14 0 q7 8 14 0 q7 -8 14 0 q7 8 14 0" fill="none" stroke="#1c211b" stroke-width="0.9" opacity="0.6"/>
  <path d="M480 222 q7 -8 14 0 q7 8 14 0 q7 -8 14 0 q7 8 14 0" fill="none" stroke="#1c211b" stroke-width="0.9" opacity="0.6"/>
  <text x="168" y="263" text-anchor="middle" font-size="10.5" fill="#777d75" font-style="italic">ℬ z</text>
  <text x="338" y="263" text-anchor="middle" font-size="10.5" fill="#777d75" font-style="italic">ℬ z′</text>
  <text x="508" y="263" text-anchor="middle" font-size="10.5" fill="#777d75" font-style="italic">ℬ z″</text>

  <line x1="150" y1="196" x2="150" y2="140" stroke="#1c211b" stroke-width="1" marker-end="url(#darkArrow)"/>
  <line x1="188" y1="140" x2="188" y2="196" stroke="#777d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#lightArrow)"/>
  <text x="106" y="172" text-anchor="end" font-size="10.5" fill="#1c211b">z = C(x)</text>
  <text x="238" y="172" font-size="10.5" fill="#777d75">x ~ p(x | z)</text>
  <text x="330" y="317" text-anchor="middle" font-size="12" fill="#1c211b">概念指认的不是一个坐标，而是一类可互换的微观实现</text>
</svg>
