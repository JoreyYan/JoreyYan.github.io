<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="Georgia, 'Noto Serif SC', serif">
  <rect width="660" height="400" fill="#f3f0e7"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1c211b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="330" y="32" text-anchor="middle" font-size="15" fill="#1c211b">图 1 · 亚稳性产生离散性</text>
  <text x="330" y="53" text-anchor="middle" font-size="11.5" fill="#777d75" font-style="italic">连续势能面上的两个长寿命盆地</text>

  <line x1="88" y1="330" x2="590" y2="330" stroke="#1c211b" stroke-width="1"/>
  <line x1="88" y1="330" x2="88" y2="92" stroke="#1c211b" stroke-width="1"/>
  <text x="600" y="335" font-size="12" fill="#1c211b" font-style="italic">x</text>
  <text x="88" y="82" text-anchor="middle" font-size="12" fill="#1c211b" font-style="italic">U(x)</text>

  <path d="M128 122 C145 235 170 300 215 300 C260 300 285 235 330 225 C375 235 400 300 445 300 C490 300 515 235 532 122" fill="none" stroke="#1c211b" stroke-width="2"/>

  <circle cx="215" cy="300" r="5" fill="#1c211b"/>
  <circle cx="445" cy="300" r="5" fill="#1c211b"/>
  <line x1="215" y1="300" x2="215" y2="330" stroke="#777d75" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="445" y1="300" x2="445" y2="330" stroke="#777d75" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="215" y="350" text-anchor="middle" font-size="12" fill="#1c211b">z = 0</text>
  <text x="445" y="350" text-anchor="middle" font-size="12" fill="#1c211b">z = 1</text>

  <circle cx="330" cy="225" r="3.5" fill="#f3f0e7" stroke="#1c211b" stroke-width="1.3"/>
  <line x1="330" y1="229" x2="330" y2="300" stroke="#1c211b" stroke-width="0.9" stroke-dasharray="4 3"/>
  <line x1="319" y1="300" x2="341" y2="300" stroke="#1c211b" stroke-width="0.9"/>
  <text x="345" y="260" font-size="12.5" fill="#1c211b">ΔU</text>
  <text x="345" y="278" font-size="10.5" fill="#777d75">势垒</text>

  <path d="M198 296 q5 -8 10 0 q5 8 10 0 q5 -8 10 0" fill="none" stroke="#1c211b" stroke-width="1" opacity="0.6"/>
  <text x="120" y="242" font-size="11.5" fill="#1c211b">阱内涨落</text>
  <text x="120" y="259" font-size="11" fill="#777d75" font-style="italic">τ intra</text>
  <line x1="172" y1="253" x2="201" y2="290" stroke="#777d75" stroke-width="0.8"/>

  <path d="M245 199 Q330 151 415 199" fill="none" stroke="#1c211b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="330" y="157" text-anchor="middle" font-size="11.5" fill="#1c211b">跃迁</text>
  <text x="330" y="175" text-anchor="middle" font-size="11" fill="#777d75" font-style="italic">τ inter ~ exp(ΔU / kT)</text>

  <text x="330" y="383" text-anchor="middle" font-size="12" fill="#1c211b">τ intra ≪ τ inter  ⇒  中间尺度上出现两个稳定状态</text>
</svg>
